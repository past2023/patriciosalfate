<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Патрисио Сальфате</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root{ --bg:#0a0a0c; --text:#f0ece4; --muted:#8f8c96; --accent:#ff2ea6; --line:rgba(240,236,228,.14) }
    *{ box-sizing:border-box; margin:0; padding:0 }
    body{ background:var(--bg); color:var(--text); font-family:'JetBrains Mono', monospace; min-height:100svh; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:26px; padding:24px; overflow:hidden }
    canvas{ position:fixed; inset:0; width:100%; height:100%; opacity:.5 }
    .code{ font-family:'Unbounded', sans-serif; font-weight:800; font-size:clamp(5rem, 22vw, 13rem); line-height:1; color:transparent; -webkit-text-stroke:1.5px var(--accent); position:relative; z-index:1 }
    .msg{ color:var(--muted); font-size:13px; letter-spacing:.14em; text-transform:uppercase; text-align:center; position:relative; z-index:1 }
    a{ position:relative; z-index:1; display:inline-flex; align-items:center; gap:10px; margin-top:10px; padding:15px 26px; border:1px solid var(--line); border-radius:999px; color:var(--text); text-decoration:none; font-size:12px; letter-spacing:.14em; text-transform:uppercase; transition:background .3s, color .3s, border-color .3s }
    a:hover{ background:var(--accent); color:var(--bg); border-color:var(--accent) }
  </style>
</head>
<body>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="code">404</div>
  <p class="msg">Страница не найдена · Page not found</p>
  <a href="/">На главную · Go home ↗</a>
  <script>
    (function () {
      const c = document.getElementById('stars');
      const x = c.getContext('2d');
      let w, h, pts = [];
      function rs() {
        w = c.width = innerWidth; h = c.height = innerHeight;
        pts = Array.from({ length: 70 }, () => ({
          x: Math.random() * w, y: Math.random() * h,
          r: Math.random() * 1.6 + 0.4,
          s: Math.random() * 0.35 + 0.08,
          a: Math.random() * Math.PI * 2,
        }));
      }
      rs();
      addEventListener('resize', rs);
      (function loop() {
        requestAnimationFrame(loop);
        x.clearRect(0, 0, w, h);
        for (const p of pts) {
          p.a += 0.01;
          p.y -= p.s;
          if (p.y < -4) { p.y = h + 4; p.x = Math.random() * w; }
          const tw = 0.35 + 0.65 * Math.abs(Math.sin(p.a));
          x.beginPath();
          x.arc(p.x, p.y, p.r, 0, 7);
          x.fillStyle = 'rgba(240,236,228,' + (0.5 * tw).toFixed(2) + ')';
          x.fill();
        }
      })();
    })();
  </script>
</body>
</html>
